<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name Here - Links</title>
  <meta name="description" content="A minimal, flat 2D link aggregator.">
  
  <style>
    :root {
      /* Colors */
      --bg: #000000;
      --surface: #0a0a0a;
      --text-primary: #ffffff;
      --text-secondary: #808080;
      --text-tertiary: #404040;
      --border: #1a1a1a;
      --accent: #ffffff;
      
      /* Typography */
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      --font-serif: 'Georgia', 'Garamond', 'Times New Roman', serif;
      
      /* Spacing (8px base) */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 48px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Accessibility focus states */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .container {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: 0 var(--space-md);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Header Spacer */
    header {
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-md) 0;
    }

    .hero {
      text-align: left;
      padding: var(--space-2xl) 0 var(--space-xl) 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border: 1px solid var(--border);
      object-fit: cover;
      margin-bottom: var(--space-lg);
      border-radius: 0; /* Strict 2D pure rectangle requirement */
      background-color: var(--surface);
    }

    .title {
      font-size: 64px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -1px;
      margin-bottom: var(--space-sm);
      word-break: break-word;
    }

    .subtitle {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 16px;
      font-weight: 400;
      color: var(--text-secondary);
      margin-bottom: var(--space-md);
    }

    .bio {
      font-size: 14px;
      line-height: 1.6;
      max-width: 480px;
      color: rgba(255, 255, 255, 0.85);
    }

    .links-section {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      padding-bottom: var(--space-2xl);
    }

    .link-card {
      display: flex;
      align-items: center;
      min-height: 64px;
      padding: var(--space-md);
      background-color: var(--surface);
      border: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s ease, opacity 0.2s ease;
      cursor: pointer;
    }

    .link-card:hover, .link-card:focus {
      border-color: var(--accent);
    }

    .link-card .icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-right: var(--space-md);
      flex-shrink: 0;
    }

    .link-card .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      text-align: left;
    }

    .link-card .link-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-card .link-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-card .arrow {
      color: var(--text-secondary);
      margin-left: var(--space-md);
      transition: color 0.2s ease;
    }

    .link-card:hover .arrow, .link-card:focus .arrow {
      color: var(--text-primary);
    }

    footer {
      text-align: center;
      padding: var(--space-xl) 0;
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: auto;
    }

    @media (max-width: 480px) {
      .container {
        padding: 0;
      }
      header, .hero, .links-section, footer {
        padding-left: var(--space-md);
        padding-right: var(--space-md);
      }
      .links-section {
        padding-left: 0;
        padding-right: 0;
      }
      .link-card {
        border-left: none;
        border-right: none;
      }
    }
  </style>
</head>
<body>
  
  <div class="container" id="app-container">
    <header>
      <!-- Spacer for potential future branding/logo -->
      <div></div>
    </header>

    <main>
      <section class="hero" aria-label="Profile Information">
        <img src="apsley logo orange.png" alt="Profile Avatar" class="avatar">
        <h1 class="title">apsley</h1>
        <p class="subtitle">Digital Services</p>
        <p class="bio">Links Are Below!</p>
      </section>

      <nav class="links-section" aria-label="Primary Links">
        
        <a href="https://www.instagram.com/apsleyhouse_/" target="_blank" rel="noopener noreferrer" class="link-card">
          <div class="icon" aria-hidden="true">📸</div>
          <div class="content">
            <span class="link-title">Apsley House Studio</span>
            <span class="link-desc">instagram.com/apsleyhouse_</span>
          </div>
          <div class="arrow" aria-hidden="true">→</div>
        </a>

        <a href="https://www.instagram.com/sy_bd86/?utm_source=ig_web_button_share_sheet" target="_blank" rel="noopener noreferrer" class="link-card">
          <div class="icon" aria-hidden="true">📷</div>
          <div class="content">
            <span class="link-title">Personal Account</span>
            <span class="link-desc">instagram.com/sy_bd86</span>
          </div>
          <div class="arrow" aria-hidden="true">→</div>
        </a>

        <a href="https://daarhadeeth.com/" target="_blank" rel="noopener noreferrer" class="link-card">
          <div class="icon" aria-hidden="true">🌐</div>
          <div class="content">
            <span class="link-title">Daar Al-Hadeeth</span>
            <span class="link-desc">daarhadeeth.com</span>
          </div>
          <div class="arrow" aria-hidden="true">→</div>
        </a>

      </nav>
    </main>

    <footer>
      <p>Made minimally • Edit in your repository</p>
    </footer>
  </div>

</body>
</html>
